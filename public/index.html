<!doctype html>
<html>

<head>
  <title>Firebase Basic Example</title>
  <!-- including FusionCharts core package JS files -->
  <script src="https://static.fusioncharts.com/code/latest/fusioncharts.js"></script>
  <link rel="stylesheet" href="assets/css/main.css">

  <!-- including Firebase -->
  <script src="https://www.gstatic.com/firebasejs/4.6.2/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/4.6.2/firebase-database.js"></script>
  <script src="assets/scripts/app.js"></script>
  <script>
      window.addEventListener("load", getData(genFunction));

      function getData(callbackIN) {
          var ref = firebase.database().ref("aqi").limitToLast(1000);
          ref.once('value').then(function (snapshot) {
              callbackIN(snapshot.val())
          });
      }

      function genFunction(data) {

          console.log(data);
          var pm25Label = [];
          var pm25 = [];
          var pm25WHO = [];
          var pm10 = [];
          var pm10WHO = [];

          var pm25Sum = 0;
          var pm25Num = 0;
          var pm10Sum = 0;
          var pm10Num = 0;

          for (var prop in data) {

              pm25Label.push({
                  label: data[prop]['time']
              });

              pm25.push({
                  value: data[prop]['pm25']
              });

              pm25Sum += data[prop]['pm25'];
              pm25Num += 1;

              pm25WHO.push({
                  value: 10
              });

              pm10.push({
                  label: data[prop]['time'],
                  value: data[prop]['pm10']
              });

              pm10WHO.push({
                  label: data[prop]['time'],
                  value: 20
              });

              pm10Sum += data[prop]['pm10'];
              pm10Num += 1;
          }

          document.getElementById("average25").textContent = " " + Math.round((pm25Sum / pm25Num)*10)/10 + " μg/m3";
          document.getElementById("average10").textContent = " " + Math.round((pm10Sum / pm10Num)*10)/10 + " μg/m3";

          const dataSourcePM25 = {
              "chart": {
                  "caption": "Air Quality Index",
                  "subCaption": "PM 2.5",
                  "yaxisname": "PM 2.5",
                  "subcaption": "Real PM 2.5 vs. WHO recommendation",
                  "drawcrossline": "1",
                  "numbersuffix": " μg/m3",
                  "showValues": "0",
                  "plottooltext": "$seriesName's $dataValue at $label",


                  "captionFontSize": "30",
                  "subCaptionFontSize": "22",
                  "captionPadding": "15",
                  "captionFontColor": "#8C8C8C",
                  "baseFontSize": "14",
                  "baseFont": "Barlow",
                  "canvasBgAlpha": "0",
                  "bgColor": "#FFFFFF",
                  "bgAlpha": "100",
                  "showBorder": "0",
                  "divLineAlpha": "5",
                  "showAxisLines": "1",
                  "drawAnchors": "0",
                  "xAxisLineColor": "#8C8C8C",
                  "xAxisLineThickness": "0.7",
                  "xAxisLineAlpha": "50",
                  "yAxisLineColor": "#8C8C8C",
                  "yAxisLineThickness": "0.7",
                  "yAxisLineAlpha": "50",
                  "baseFontColor": "#8C8C8C",
                  "toolTipBgColor": "#ecfaec"
              },
              "categories": [
                  {
                      "category": pm25Label
                  }
              ],
              "dataset": [
                  {
                      "seriesname": "PM 2.5",
                      "data": pm25,

                  },
                  {
                      "seriesname": "WHO",
                      "data": pm25WHO,

                  }
              ]
          };



          var firebaseChartPm25 = new FusionCharts({
              type: 'msarea',
              renderAt: 'chart-container-pm25',
              width: '90%',
              height: '600',
              dataFormat: 'json',
              dataSource: dataSourcePM25
          });

          firebaseChartPm25.render();


          const dataSourcePM10 = {
              "chart": {
                  "caption": "Air Quality Index",
                  "subCaption": "PM 10",
                  "yaxisname": "PM 10",
                  "subcaption": "Real PM 10 vs. WHO recommendation",
                  "drawcrossline": "1",
                  "numbersuffix": " μg/m3",
                  "showValues": "0",
                  "plottooltext": "$seriesName's $dataValue at $label",
                  "captionFontSize": "30",
                  "subCaptionFontSize": "22",
                  "captionPadding": "15",
                  "captionFontColor": "#8C8C8C",
                  "baseFontSize": "14",
                  "baseFont": "Barlow",
                  "canvasBgAlpha": "0",
                  "bgColor": "#FFFFFF",
                  "bgAlpha": "100",
                  "showBorder": "0",
                  "divLineAlpha": "5",
                  "showAxisLines": "1",
                  "drawAnchors": "0",
                  "xAxisLineColor": "#8C8C8C",
                  "xAxisLineThickness": "0.7",
                  "xAxisLineAlpha": "50",
                  "yAxisLineColor": "#8C8C8C",
                  "yAxisLineThickness": "0.7",
                  "yAxisLineAlpha": "50",
                  "baseFontColor": "#8C8C8C",
                  "toolTipBgColor": "#ecfaec"
              },
              "categories": [
                  {
                      "category": pm25Label
                  }
              ],
              "dataset": [
                  {
                      "seriesname": "PM 10",
                      "data": pm10,

                  },
                  {
                      "seriesname": "WHO",
                      "data": pm10WHO,

                  }
              ]
          };

          var firebaseChartPm10 = new FusionCharts({
              type: 'msarea',
              renderAt: 'chart-container-pm10',
              width: '90%',
              height: '600',
              dataFormat: 'json',
              dataSource: dataSourcePM10
          });

          firebaseChartPm10.render();

      }

  </script>
</head>

<body>
<div id="chart-container-pm25"><svg width="90px"  height="90px"  xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid" class="lds-rolling" style="background: none;"><circle cx="50" cy="50" fill="none" ng-attr-stroke="{{config.color}}" ng-attr-stroke-width="{{config.width}}" ng-attr-r="{{config.radius}}" ng-attr-stroke-dasharray="{{config.dasharray}}" stroke="#6ac1a5" stroke-width="9" r="33" stroke-dasharray="155.50883635269477 53.83627878423159" transform="rotate(324 50 50)"><animateTransform attributeName="transform" type="rotate" calcMode="linear" values="0 50 50;360 50 50" keyTimes="0;1" dur="1s" begin="0s" repeatCount="indefinite"></animateTransform></circle></svg></div>
</br>
<div id="chart-container-pm10"><svg width="90px"  height="90px"  xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid" class="lds-rolling" style="background: none;"><circle cx="50" cy="50" fill="none" ng-attr-stroke="{{config.color}}" ng-attr-stroke-width="{{config.width}}" ng-attr-r="{{config.radius}}" ng-attr-stroke-dasharray="{{config.dasharray}}" stroke="#6ac1a5" stroke-width="9" r="33" stroke-dasharray="155.50883635269477 53.83627878423159" transform="rotate(324 50 50)"><animateTransform attributeName="transform" type="rotate" calcMode="linear" values="0 50 50;360 50 50" keyTimes="0;1" dur="1s" begin="0s" repeatCount="indefinite"></animateTransform></circle></svg></div>
</br>

<p>
  <span>Average PM 2.5:</span><span id="average25">25</span></br>
  <span>WHO PM 2.5:</span><span> 10  μg/m3</span>
</p>

<p>
  <span>Average PM 10:</span><span id="average10">10</span></br>
  <span>WHO PM 10:</span><span> 20  μg/m3</span>
</p>

</body>

</html>
